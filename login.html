<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Sygmatel — Accès</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="icon" type="image/svg+xml" href="sygmatel-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0c;
      --surface: #151517;
      --surface-2: #1c1c1f;
      --border: #2a2a2e;
      --border-strong: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --faint: #71717a;
      --accent: #5bc2ce;
      --on-accent: #06262b;
      --red: #e84e36;
      --danger: #f87171;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f6f7;
        --surface: #ffffff;
        --surface-2: #f1f1f3;
        --border: #e4e4e7;
        --border-strong: #c4c4cc;
        --text: #18181b;
        --muted: #52525b;
        --faint: #71717a;
        --accent: #1f8a96;
        --on-accent: #ffffff;
        --danger: #dc2626;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(60rem 28rem at 78% -8%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 70%),
        radial-gradient(40rem 22rem at 8% 108%, color-mix(in oklab, var(--red) 9%, transparent), transparent 70%),
        radial-gradient(color-mix(in oklab, var(--border-strong) 55%, transparent) 1px, transparent 1.5px);
      background-size: auto, auto, 22px 22px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.04), 0 10px 40px rgb(0 0 0 / 0.25);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .brand img { width: 30px; height: auto; display: block; }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 44px;
      line-height: 1;
      margin: 22px 0 8px;
    }
    h1 em { color: var(--accent); }
    p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    form { margin-top: 24px; display: grid; gap: 12px; }
    label { font-size: 12px; color: var(--muted); text-align: left; }
    input {
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font: 500 20px "Geist Mono", ui-monospace, monospace;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 0 14px;
    }
    input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent; }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 15px "Geist", system-ui, sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: wait; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .error { min-height: 20px; color: var(--danger); font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="sygmatel-mark.svg" alt="" />
      Sygmatel
    </div>
    <h1>Le <em>Lab</em></h1>
    <p>Saisissez le code d'accès pour ouvrir les applications.</p>

    <form id="form" novalidate>
      <label for="code">Code d'accès</label>
      <input id="code" name="code" type="password" inputmode="text" autocomplete="current-password" autofocus required />
      <div class="error" id="error" role="alert"></div>
      <button type="submit" id="submit">Entrer</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("code");
    const error = document.getElementById("error");
    const button = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const code = input.value.trim();
      if (!code) {
        error.textContent = "Saisissez le code d'accès.";
        return;
      }
      button.disabled = true;
      error.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        if (res.ok) {
          window.location.replace("/");
          return;
        }
        const data = await res.json().catch(() => null);
        error.textContent = (data && data.error) || "Accès refusé.";
        input.value = "";
        input.focus();
      } catch (e) {
        error.textContent = "Connexion impossible. Réessayez.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
